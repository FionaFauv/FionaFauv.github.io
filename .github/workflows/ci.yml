name: CI

# Vérifie chaque PR avant fusion : une PR qui casse le site ne peut pas être fusionnée
# (check « Vérifications » rendu obligatoire dans le ruleset protection-main-dev).
on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

# Un nouveau push sur la PR annule la vérification en cours.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifications:
    name: Vérifications
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Astro check
        run: npm run check

      - name: Build
        run: npm run build
